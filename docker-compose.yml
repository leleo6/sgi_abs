services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgi_abs_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8085}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-sgi_abs}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASSWORD:-root_password}
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
      - uploads_data:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: sgi_abs_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-sgi_abs}
    ports:
      - "${DB_PORT_EXTERNAL:-3308}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD:-root_password} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: sgi_abs_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8086}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-root}
      PMA_PASSWORD: ${DB_PASSWORD:-root_password}
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
    name: sgi_abs_db_data
  uploads_data:
    name: sgi_abs_uploads_data
